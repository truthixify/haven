version: '3.8'
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: haven
      POSTGRES_USER: haven
      POSTGRES_PASSWORD: haven_tee_secret
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  tee:
    build: .
    depends_on:
      - postgres
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: haven
      DATABASE_USER: haven
      DATABASE_PASSWORD: haven_tee_secret
    ports:
      - "3000:3000"
    volumes:
      - ./data:/data

volumes:
  pgdata:
