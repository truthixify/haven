[package]
name = "pccs-reader-rs"
version = "1.1.1"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
serde = { version = "1.0", features = ["derive"] }
hex = "0.4.3"
serde_json = "1.0"
alloy = { version = "1.0.41", default-features = false, features = ["full", "node-bindings", "rpc-types", "rpc-types-eth", "contract"] }
anyhow = "^1.0.93"
x509-parser = "0.15.1"
tokio = { version = "1.48", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2.0.12"
pem = "3.0.5"
automata-dcap-evm-bindings = { path = "../bindings" }
automata-dcap-network-registry = { path = "../network-registry" }
automata-dcap-utils = { path = "../utils" }
dcap-rs = { path = "../dcap-rs" }
