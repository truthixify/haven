[package]
name = "automata-dcap-network-registry"
version = "1.1.1"
edition = "2021"
include = [
    "src/**/*",
    "build.rs",
    "metadata.toml",
    "deployment/**/*",
    "!deployment/cache/**",
]

[dependencies]
alloy = { version = "1.0.41", default-features = false, features = ["full", "node-bindings", "rpc-types", "rpc-types-eth", "contract"] }
anyhow = "^1.0.93"
automata-dcap-evm-bindings = { path = "../bindings" }
automata-dcap-utils = { path = "../utils" }
include_dir = "0.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

[build-dependencies]
anyhow = "^1.0.93"
hex = "0.4.3"
reqwest = { version = "0.12", features = ["blocking"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
flate2 = "1.0"
tar = "0.4"
sha2 = "0.10"
