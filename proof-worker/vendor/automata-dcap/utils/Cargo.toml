[package]
name = "automata-dcap-utils"
version = "1.1.1"
edition = "2021"

[lib]
name = "automata_dcap_utils"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[dependencies]
anyhow = "^1.0.93"
hex = "0.4.3"
serde = { version = "1.0", features = ["derive"] }
dcap-rs = { path = "../dcap-rs" }
alloy = { version = "1.0.41", default-features = false, features = ["sol-types"] }

# WASM dependencies (optional)
wasm-bindgen = { version = "0.2.99", optional = true }
serde-wasm-bindgen = { version = "0.6.5", optional = true }
getrandom = { version = "0.2", features = ["js"], optional = true }

[build-dependencies]
toml = "0.8"
proc-macro2 = "1.0"
quote = "1.0"

[features]
default = []
wasm = ["wasm-bindgen", "serde-wasm-bindgen", "getrandom"]
