name: Publish SDK

on:
  push:
    paths:
      - 'sdk/**'
    branches:
      - main
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        working-directory: sdk
        run: npm ci

      - name: Build
        working-directory: sdk
        run: npm run build

      - name: Auto bump patch version
        working-directory: sdk
        run: |
          NPM_VERSION=$(npm view @haven-protocol-ckb/sdk version 2>/dev/null || echo "0.0.0")
          NEW_VERSION=$(node -e "const [a,b,c]=('$NPM_VERSION').split('.').map(Number); console.log(a+'.'+b+'.'+(c+1))")
          npm version $NEW_VERSION --no-git-tag-version --allow-same-version
          echo "Publishing v$NEW_VERSION"

      - name: Publish
        working-directory: sdk
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Trigger Vercel dashboard redeploy
        if: success()
        run: |
          if [ -n "${{ secrets.VERCEL_DEPLOY_HOOK }}" ]; then
            curl -s -X POST "${{ secrets.VERCEL_DEPLOY_HOOK }}"
            echo "Vercel redeploy triggered"
          else
            echo "VERCEL_DEPLOY_HOOK not set — skipping"
          fi
